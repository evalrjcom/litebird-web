name: Build LiteBird

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfltk1.3-dev libcurl4-openssl-dev

    - name: Build
      run: make

    - name: Check binary
      run: |
        file litebird
        ldd litebird || true
