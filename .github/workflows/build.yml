name: Build LiteBird

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # ---------- Linux ----------
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfltk1.3-dev libcurl4-openssl-dev

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: make

    - name: Check binary (Linux)
      if: runner.os == 'Linux'
      run: |
        file litebird
        ldd litebird || true

    # ---------- Windows ----------
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install fltk curl --triplet x64-windows

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
        if not defined VSINSTALL (
          echo Could not locate Visual Studio via vswhere
          exit /b 1
        )
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1
        cl /EHsc /std:c++17 /MD litebird.cpp ^
          /I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" ^
          /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib" ^
          fltk.lib fltk_forms.lib fltk_images.lib fltk_gl.lib curl.lib ^
          ws2_32.lib comctl32.lib gdi32.lib user32.lib shell32.lib ole32.lib uuid.lib ^
          oleaut32.lib advapi32.lib comdlg32.lib opengl32.lib glu32.lib crypt32.lib wldap32.lib normaliz.lib
        if errorlevel 1 exit /b 1
        ren litebird.exe litebird-windows.exe

    # ---------- Artifacts ----------
    - name: Upload Linux binary
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: litebird-linux
        path: litebird

    - name: Upload Windows binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: litebird-windows
        path: litebird-windows.exe
