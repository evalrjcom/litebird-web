name: Build LiteBird

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # ---------- Linux ----------
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libfltk1.3-dev libcurl4-openssl-dev

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: make

    - name: Check binary (Linux)
      if: runner.os == 'Linux'
      run: |
        file litebird
        ldd litebird || true

    # ---------- Windows ----------
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install fltk curl --triplet x64-windows

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /std:c++17 /MD litebird.cpp ^
          /I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" ^
          /link /LIBPATH:"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib" ^
          fltk.lib fltk_forms.lib fltk_images.lib fltk_gl.lib curl.lib ^
          ws2_32.lib comctl32.lib gdi32.lib user32.lib shell32.lib ole32.lib uuid.lib
        ren litebird.exe litebird-windows.exe

    # ---------- Artifacts ----------
    - name: Upload Linux binary
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: litebird-linux
        path: litebird

    - name: Upload Windows binary
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: litebird-windows
        path: litebird-windows.exe
